<style>

  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 16px; border-radius: 8px;
    text-decoration: none; font-family: var(--display); font-weight: 600;
    margin-bottom: 30px; transition: all 0.2s;

  .back-btn:hover { border-color: var(--cyan); background: var(--surface-3); box-shadow: 0 4px 12px var(--cyan-glow);}

  .section-head { margin-bottom: 32px; text-align: center; }
  .eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .section-head h2 { font-family: var(--display); font-weight: 700; font-size: 32px; margin: 0 0 16px 0; color: var(--text); }
  .section-head p { font-size: 16px; color: var(--muted); max-width: 700px; margin: 0 auto; }

/* Explorer Layout */

  .chip {

  .chip:hover { border-color: var(--cyan); color: var(--text); }
  .chip.active { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); font-weight: 600; }

  .explorer {
    display: grid; grid-template-columns: 340px 1fr; gap: 0;
    border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface);

  .search-box input:focus { border-color: var(--cyan); }
  .search-box input::placeholder { color: var(--muted-2); }

  .nav-list { overflow-y: auto; padding: 10px; max-height: 650px; scrollbar-width: thin; }
  .nav-group-title { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted-2); padding: 12px 10px 6px; }
  .nav-item {

  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: rgba(53, 225, 193, 0.08); color: var(--cyan); border-color: var(--cyan-dim); font-weight: 500; }
  .nav-item .num { font-family: var(--mono); font-size: 10.5px; color: var(--muted-2); min-width: 20px; }
  .nav-item.active .num { color: var(--cyan); }
  .nav-item .ic { font-size: 15px; }

  /* Detail Panel */

  .detail-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--cyan); background: var(--surface-2); border: 1px solid var(--cyan-dim); padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }

  .detail-overview { color: var(--muted); font-size: 15px; line-height: 1.65; margin-bottom: 24px; padding-left: 16px; border-left: 3px solid var(--cyan); }

  .subfeature-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 28px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .subfeature-table th { background: var(--surface-2); font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--muted-2); text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .subfeature-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: top; }

  .sf-name { font-family: var(--display); font-weight: 600; color: var(--text); }
  .sf-how { color: var(--muted); font-size: 13px; }
  .sf-benefit { color: var(--cyan); font-size: 12.5px; font-family: var(--mono); }

  .file-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .file-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;

  .file-card:hover { border-color: var(--cyan-dim); }
  .file-card .fname { color: var(--cyan); font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .file-card .fpath { color: var(--muted-2); font-size: 10.5px; word-break: break-all; }

  
</style>

function renderCategories() {
  const categories = ['ALL', 'Detection Core', 'Financial Security', 'Security & Storage', 'Creation Suite', 'Identity & Access', 'Cloud & Auth', 'Everyday Access', 'Engineering', 'Web Portal'];
  const container = document.getElementById('categoryChips');
  container.innerHTML = categories.map(cat => `
    <button class="chip ${cat === currentCategoryFilter ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
  `).join('');
}

function setCategory(cat) {
  currentCategoryFilter = cat;
  renderCategories();
  renderNav();
}

function renderNav() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const navList = document.getElementById('navList');

  const filtered = FEATURES.filter(f => {
    const matchesCat = (currentCategoryFilter === 'ALL' || f.group === currentCategoryFilter);
    const matchesQuery = !query || (
      f.title.toLowerCase().includes(query) ||
      f.overview.toLowerCase().includes(query) ||
      f.files.some(file => file.name.toLowerCase().includes(query)) ||
      f.subs.some(sub => sub.name.toLowerCase().includes(query) || sub.how.toLowerCase().includes(query))
    );
    return matchesCat && matchesQuery;
  });

  if (filtered.length === 0) {
    navList.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted-2); font-family:var(--mono); font-size:12px;">No matching features found.</div>';
    return;
  }

  // Group by Category
  const grouped = {};
  filtered.forEach(f => {
    if (!grouped[f.group]) grouped[f.group] = [];
    grouped[f.group].push(f);
  });

  navList.innerHTML = Object.keys(grouped).map(group => `
    <div class="nav-group-title">${group}</div>
    ${grouped[group].map(f => `
      <div class="nav-item ${f.id === currentActiveId ? 'active' : ''}" onclick="selectFeature(${f.id})">
        <span class="num">${String(f.id).padStart(2, '0')}</span>
        <span class="ic">${f.icon}</span>
        <span>${f.title}</span>
      </div>
    `).join('')}
  `).join('');
}

function renderDetail(id) {
  const feature = FEATURES.find(f => f.id === id);
  const panel = document.getElementById('detailPanel');
  if (!feature) return;

  panel.innerHTML = `
    <div class="detail-badge">FEATURE ${String(feature.id).padStart(2, '0')} // ${feature.group.toUpperCase()}</div>
    <div class="detail-title">
      <span>${feature.icon}</span>
      <span>${feature.title}</span>
    </div>
    <div class="detail-overview">${feature.overview}</div>

    <div class="file-section-title">Sub-Feature Implementation Breakdown</div>
    <table class="subfeature-table">
      <thead>
        <tr>
          <th style="width: 25%;">Sub-Feature</th>
          <th style="width: 45%;">How It's Achieved (Technical Mechanics)</th>
          <th style="width: 30%;">Security / UX Benefit</th>
        </tr>
      </thead>
      <tbody>
        ${feature.subs.map(s => `
          <tr>
            <td class="sf-name">${s.name}</td>
            <td class="sf-how">${s.how}</td>
            <td class="sf-benefit">✔ ${s.benefit}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>

    <div class="file-section-title">Verified Source Files on Disk (${feature.files.length})</div>
        <div class="file-cards">
      ${feature.files.map(file => {
         let role = "";
         if(file.name.includes('Screen') || file.name.includes('Sheet') || file.name.includes('Card') || file.name.includes('Indicator') || file.name.includes('Tab')) {
             role = "UI & Presentation Layer";
         } else if(file.name.includes('Dao') || file.name.includes('Database') || file.name.includes('Preferences')) {
             role = "Local Data Storage & Persistence";
         } else if(file.name.includes('Analyzer') || file.name.includes('Engine') || file.name.includes('Parser')) {
             role = "Core Logic & Intelligence Engine";
         } else if(file.name.includes('Service') || file.name.includes('Worker')) {
             role = "Background Execution Service";
         } else if(file.name.includes('Manager') || file.name.includes('Utils') || file.name.includes('Router') || file.name.includes('Client')) {
             role = "Utility & Routing Controller";
         } else {
             role = "Configuration & Implementation";
         }
         return `
        <div class="file-card">
          <div class="fname">📄 ${file.name}</div>
          <div class="frole" style="font-size: 11.5px; color: var(--muted); font-family: var(--mono); margin-top: 6px; line-height: 1.4;">${role} used in:<br><span style="color: var(--cyan);">${feature.title}</span></div>
        </div>
      `}).join('')}
    </div>
          <div class="fpath">${file.path}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function selectFeature(id) {
  currentActiveId = id;
  renderNav();
  renderDetail(id);
}



function selectFeature(id) {
  currentActiveId = id;
  renderNav();
  renderDetail(id);
}

function setupSearch() {
  document.getElementById('searchInput').addEventListener('input', () => {
    renderNav();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  setupSearch();
  const urlParams = new URLSearchParams(window.location.search);
  const idParam = urlParams.get('id');
  if (idParam) {
    const id = parseInt(idParam, 10);
    if (!isNaN(id)) {
      selectFeature(id);
      return;
    }
  }
  selectFeature(1);
});
</script>
